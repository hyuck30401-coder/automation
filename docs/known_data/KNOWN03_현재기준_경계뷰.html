<style>
  .viz-root {
    color-scheme: light;
    --surface-0: #f7f7f5;
    --surface-1: #fcfcfb;
    --surface-2: #f0efec;
    --line: #dedcd6;
    --line-strong: #b4b1a8;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7872;
    --pass: #2a78d6;
    --pass-b: #1baf7a;
    --oos: #e34948;
    --zone: rgba(237, 161, 0, .18);
    --zone-line: #eda100;
    --limit: #4a3aa7;
    --ok-bg: rgba(27, 175, 122, .14);
    --ok-fg: #0f6b4b;
    --no-bg: rgba(227, 73, 72, .14);
    --no-fg: #a32a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-0: #141413;
      --surface-1: #1a1a19;
      --surface-2: #252523;
      --line: #383835;
      --line-strong: #6a6862;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #928f86;
      --pass: #3987e5;
      --pass-b: #199e70;
      --oos: #e66767;
      --zone: rgba(201, 133, 0, .26);
      --zone-line: #c98500;
      --limit: #9085e9;
      --ok-bg: rgba(25, 158, 112, .20);
      --ok-fg: #5fd3a8;
      --no-bg: rgba(230, 103, 103, .18);
      --no-fg: #ff9d9d;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-0: #141413;
    --surface-1: #1a1a19;
    --surface-2: #252523;
    --line: #383835;
    --line-strong: #6a6862;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #928f86;
    --pass: #3987e5;
    --pass-b: #199e70;
    --oos: #e66767;
    --zone: rgba(201, 133, 0, .26);
    --zone-line: #c98500;
    --limit: #9085e9;
    --ok-bg: rgba(25, 158, 112, .20);
    --ok-fg: #5fd3a8;
    --no-bg: rgba(230, 103, 103, .18);
    --no-fg: #ff9d9d;
  }

  body { background: var(--surface-0); color: var(--text-primary);
         font: 14px/1.55 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
  .viz-root { max-width: 1180px; margin: 0 auto; padding-block: 32px 64px; padding-left: 20px; padding-right: 20px; }
  h1 { font-size: 25px; letter-spacing: -.02em; margin: 0 0 6px; }
  h2 { font-size: 17px; letter-spacing: -.01em; margin: 40px 0 4px;
       padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 14px; margin: 24px 0 8px; color: var(--text-secondary); font-weight: 600; }
  p  { color: var(--text-secondary); margin: 6px 0 14px; max-width: 78ch; }
  .lede { font-size: 15px; color: var(--text-secondary); }
  code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .92em;
         background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  .legend { display: flex; flex-wrap: wrap; gap: 18px; align-items: center;
            margin: 18px 0 4px; font-size: 12.5px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 11px; height: 11px; border-radius: 50%; }
  .sw.tri { border-radius: 2px; transform: rotate(45deg); width: 9px; height: 9px; }
  .sw.band { border-radius: 2px; width: 20px; height: 11px; background: var(--zone);
             border: 1px solid var(--zone-line); }
  .sw.lim { border-radius: 2px; width: 20px; height: 4px; background: var(--limit); }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 10px 0 6px; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
  .card { background: var(--surface-1); border: 1px solid var(--line);
          border-radius: 10px; padding: 12px 14px 8px; }
  .card.full { margin-bottom: 12px; }
  .card h4 { margin: 0 0 2px; font-size: 13px; font-family: ui-monospace, Consolas, monospace;
             letter-spacing: -.01em; display: flex; justify-content: space-between;
             align-items: baseline; gap: 10px; }
  .verdict { font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: .02em;
             padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .v-Tail { background: var(--ok-bg); color: var(--ok-fg); }
  .v-Normal { background: var(--surface-2); color: var(--text-muted); }
  .v-Separated, .v-Shift { background: var(--no-bg); color: var(--no-fg); }
  .sub { font-size: 12px; color: var(--text-muted); margin: 0 0 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px;
           color: var(--text-secondary); margin: 2px 0 0; }
  .stats b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

  .delta { background: var(--surface-2); border-left: 3px solid var(--zone-line);
           border-radius: 0 8px 8px 0; padding: 9px 13px; margin: 2px 0 26px;
           font-size: 13px; color: var(--text-secondary); }
  .delta b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .callout { background: var(--surface-2); border: 1px solid var(--line);
             border-radius: 10px; padding: 14px 16px; margin: 18px 0 8px; }
  .callout p { margin: 0; color: var(--text-secondary); }
  .callout strong { color: var(--text-primary); }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 10px 0 0; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); }
  th { color: var(--text-muted); font-weight: 600; font-size: 11.5px;
       text-transform: uppercase; letter-spacing: .04em; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tick { font-size: 10px; fill: var(--text-muted); }
  .axlab { font-size: 10.5px; fill: var(--text-secondary); }
  .glab { font-size: 10.5px; fill: var(--text-primary); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .edge { stroke: var(--line-strong); stroke-width: 2; }
  .dot { stroke: var(--surface-1); stroke-width: 2; }
  .dot:hover { stroke: var(--text-primary); }

  #tip { position: fixed; z-index: 9; pointer-events: none; opacity: 0;
         transition: opacity .1s; background: var(--surface-1);
         border: 1px solid var(--line-strong); border-radius: 7px;
         padding: 6px 9px; font-size: 12px; color: var(--text-primary);
         box-shadow: 0 4px 14px rgba(0,0,0,.14); font-variant-numeric: tabular-nums; }
</style>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const by = r => D.filter(d => d.role === r);

const GROUPS = [
  { key: 'Excessive', title: 'Excessive / Slight · 스펙 이탈률 1% 임계', axis: null,
    formula: 'spec_margin_ratio = |값 − 한계| / |한계| ≥ 0.01 → Excessive',
    phys: 'spec_out_pct', physLabel: '스펙 이탈률 (%)',
    note: '집단은 전부 스펙 안이라 이 축에 그릴 게 없다. 사다리만 표시한다.' },
  { key: 'Slight', title: 'Slight / Tail · Diff_S 의 Grubbs 임계', axis: 'diff',
    formula: 'Mea_S·Diff_S 가 함께 임계 초과 → Slight, 아니면 Tail (이탈률은 1% 미만 고정)',
    phys: 'move_pct', physLabel: '이동률 |Post−Pre|/Pre (%)' },
  { key: 'Measured', title: 'Abnormal Pass · Measured — Mea_S 의 Grubbs 임계', axis: 'mea',
    formula: 'max |Mea_S| > Grubbs 임계 → Measured',
    phys: 'dev_pct', physLabel: '평균 대비 편차 (%)' },
  { key: 'Delta', title: 'Abnormal Pass · Delta — Diff_S 의 Grubbs 임계', axis: 'diff',
    formula: 'max |Diff_S| > Grubbs 임계 → Delta',
    phys: 'move_pct', physLabel: '이동률 (%)' },
  { key: 'Measured + Delta', title: 'Abnormal Pass · Measured + Delta — 두 축 임계의 네 모서리',
    axis: 'both', formula: '두 축이 모두 임계를 넘어야 Measured + Delta',
    phys: 'dev_pct', physLabel: '평균 대비 편차 (%)' },
  { key: 'TauMea', title: '스펙 대비 게이트 (Mea 축) · τ = 5%', axis: 'size',
    formula: '|값 − 평균| / 스펙폭 ≥ 5% 면 유지, 미만이면 "스펙 대비 미미"로 접힘',
    phys: 'size_pct', physLabel: '스펙 대비 크기 (%)' },
  { key: 'TauDelta', title: '스펙 대비 게이트 (Delta 축) · τ = 5%', axis: null,
    formula: '|Post − Pre| / 스펙폭 ≥ 5% 면 유지, 미만이면 접힘',
    phys: 'size_pct', physLabel: '스펙 대비 크기 (%)',
    note: '이동 축의 스펙 대비 크기는 유닛별로 payload 에 없어 사다리만 표시한다.' },
];

const W = 900, H = 132, M = { l: 44, r: 30, t: 26, b: 44 };
const PW = W - M.l - M.r, PH = H - M.t - M.b;

function ladder(g) {
  const items = by(g.key);
  if (!items.length) return '';
  const ratios = items.map(d => measured(d, g));
  const xs = ratios.filter(x => x != null);
  const x0 = 0, x1 = Math.max(1.25, ...xs) * 1.05;
  const X = v => M.l + (v - x0) / (x1 - x0) * PW;
  const rowY = M.t + PH * 0.62;
  const s = [];

  // 집단
  let pop = [];
  if (g.axis === 'mea' || g.axis === 'diff' || g.axis === 'both') {
    const base = items[0];
    pop = g.axis === 'diff' ? (base.diff_pop || []).map(v => Math.abs(v) / base.diff_t)
                            : (base.mea_pop || []).map(v => Math.abs(v) / base.mea_t);
  } else if (g.axis === 'size') {
    // 스펙 대비 크기 = |값 - 평균| / 스펙폭 = |Mea_S| x sd / 스펙폭.  tau 로 나눠 배수로.
    const base = items[0];
    const width = base.ul - base.ll;
    if (base.sd && width) pop = (base.mea_pop || []).map(v => Math.abs(v) * base.sd / width / 0.05);
  }
  const jit = i => ((i * 2654435761) % 1000) / 1000 - 0.5;
  pop.filter(v => v <= x1).forEach((v, i) => {
    s.push(`<circle cx="${X(v)}" cy="${rowY - 26 + jit(i) * 22}" r="3.4" fill="var(--pass)"
      opacity=".55" data-t="집단 유닛 · ${v.toFixed(2)} × 임계"/>`);
  });

  // 눈금 · 임계선
  for (let v = 0; v <= x1; v += 0.25) {
    s.push(`<line class="grid" x1="${X(v)}" y1="${M.t}" x2="${X(v)}" y2="${M.t + PH}"/>`);
    if (Math.abs(v - 1) > 0.01)   // 임계 눈금은 위에 따로 쓴다 — 사다리 라벨과 겹친다
      s.push(`<text class="tick" x="${X(v)}" y="${M.t + PH + 14}" text-anchor="middle">${v.toFixed(2)}</text>`);
  }
  s.push(`<line x1="${X(1)}" y1="${M.t - 6}" x2="${X(1)}" y2="${M.t + PH + 3}" stroke="var(--oos)" stroke-width="2"/>`);
  s.push(`<text class="axlab" x="${X(1)}" y="${M.t - 10}" text-anchor="middle" fill="var(--oos)">임계 1.00</text>`);

  // 사다리
  items.forEach((d, i) => {
    const v = ratios[i];
    if (v == null) return;
    const hit = caught(d, g);
    const cx = X(v), cy = rowY + 16;
    s.push(`<rect x="${cx - 5}" y="${cy - 5}" width="10" height="10" rx="1.5"
      transform="rotate(45 ${cx} ${cy})" fill="${hit ? 'var(--ok-fg)' : 'var(--text-muted)'}"
      stroke="var(--surface-1)" stroke-width="2"
      data-t="${d.name} · 실측 ${v.toFixed(3)} × 임계 · ${verdict(d, g)}"/>`);
    const dy = (i % 2) ? 20 : 32;      // 임계 근처에 몰려서 라벨을 번갈아 내린다
    s.push(`<line x1="${cx}" y1="${cy + 7}" x2="${cx}" y2="${cy + dy - 9}" stroke="var(--line)" stroke-width="1"/>`);
    s.push(`<text class="tick" x="${cx}" y="${cy + dy}" text-anchor="middle">${fmtTarget(d.target)}</text>`);
  });
  s.push(`<text class="tick" x="${M.l}" y="${M.t + PH + 26}" text-anchor="start">← 기준 미달</text>`);
  s.push(`<text class="tick" x="${W - M.r}" y="${M.t + PH + 26}" text-anchor="end">기준 초과 →  (임계 대비 배수)</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${g.title}">${s.join('')}</svg>`;
}

function fmtTarget(t) { return Array.isArray(t) ? t.map(x => x.toFixed(2)).join('/') : Number(t).toFixed(2); }
function measured(d, g) {
  if (g.key === 'Excessive') return d.spec_out_pct / 1.0;      // %, 임계 1%
  if (g.key === 'Slight' || g.key === 'Delta') return d.diff_s == null ? null : Math.abs(d.diff_s) / d.diff_t;
  if (g.key === 'Measured') return d.mea_s == null ? null : Math.abs(d.mea_s) / d.mea_t;
  if (g.key === 'Measured + Delta') return d.mea_s == null ? null : Math.abs(d.mea_s) / d.mea_t;
  return d.size_pct == null ? null : d.size_pct / 5.0;
}
function verdict(d, g) {
  if (['Excessive', 'Slight'].includes(g.key)) return d.fail_type || '(없음)';
  if (['TauMea', 'TauDelta'].includes(g.key)) return (d.reason || '(없음)') + ' · ' + (d.gate || '-');
  return d.reason || '(없음)';
}
function caught(d, g) {
  if (g.key === 'Excessive') return d.fail_type === 'Excessive';
  if (g.key === 'Slight') return d.fail_type === 'Slight';
  if (g.key === 'Measured') return d.reason === 'Measured';
  if (g.key === 'Delta') return d.reason === 'Delta';
  if (g.key === 'Measured + Delta') return !!d.reason;
  return d.gate === 'kept';
}

const F = (v, n = 3) => (v == null ? '–' : Number(v).toFixed(n));
function groupTable(g) {
  const items = by(g.key);
  const phys = items.map(d => d[g.phys]);
  const lo = items[0], hi = items[items.length - 1];
  const rows = items.map((d, i) => {
    const prev = i ? phys[i - 1] : null;
    const step = (prev != null && phys[i] != null) ? Math.abs(phys[i] - prev) : null;
    const absStep = (prev != null && d.post != null && items[i - 1].post != null)
      ? Math.abs(d.post - items[i - 1].post) : null;
    return `<tr><td><code>${d.name}</code></td><td class="n">${fmtTarget(d.target)}</td>
      <td class="n">${F(measured(d, g))}</td>
      <td class="n">${F(d[g.phys], 3)}</td>
      <td class="n">${step == null ? '–' : F(step, 3)}</td>
      <td>${verdict(d, g)}</td></tr>`;
  }).join('');
  return `<div class="tablewrap"><table>
    <thead><tr><th>항목</th><th class="n">목표비</th><th class="n">실측비</th>
    <th class="n">${g.physLabel}</th><th class="n">한 칸 차이</th><th>판정</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

document.getElementById('groups').innerHTML = GROUPS.map(g => `
  <h2>${g.title}</h2>
  <p><code>${g.formula}</code>${g.note ? '<br>' + g.note : ''}</p>
  <div class="card full">${ladder(g)}</div>
  ${groupTable(g)}
`).join('');

// 헤드라인 — 0.99 ↔ 1.01 한 쌍이 실제 값으로 얼마인지
const pairs = [];
for (const g of GROUPS) {
  const items = by(g.key);
  const a = items.find(d => d.target === 0.99), b = items.find(d => d.target === 1.01);
  if (a && b && a[g.phys] != null && b[g.phys] != null) {
    pairs.push(`<b>${g.key}</b> ${F(a[g.phys], 3)} → ${F(b[g.phys], 3)} ${g.physLabel.match(/\((.*)\)/)?.[1] || ''}`);
  }
}
document.getElementById('headline').innerHTML =
  `<p><strong>임계 바로 양옆(0.99 ↔ 1.01)이 실제 값으로 얼마나 차이나는가:</strong><br>${pairs.join('<br>')}</p>
   <p style="margin-top:8px">전부 <strong>측정값의 0.02 ~ 0.1 %p</strong> 수준이다. 그래프에서
   두 유닛을 나란히 놓아도 구분되지 않는 폭이고, 보통 테스터 반복성과 같거나 그보다 작다.
   경계 근처 건은 "기준을 넘었다"가 아니라 <strong>"기준 근처다"</strong>로 읽어야 하고,
   판정만 보지 말고 <strong>임계 대비 배수</strong>를 같이 봐야 한다는 뜻이다.</p>
   <p style="margin-top:8px">반대로 <strong>집단은 임계에서 한참 떨어져 있다</strong> —
   아래 각 그림에서 파란 점(집단)이 0 ~ 0.75 배 구간에 몰려 있고 사다리만 1.00 근처에 붙어 있다.
   즉 임계 자체는 집단과 확실히 구분되는 자리에 있고, 애매한 건 임계 <strong>바로 옆</strong>의
   소수뿐이다.</p>`;

document.getElementById('tbl').innerHTML =
  `<thead><tr><th>항목</th><th>유형</th><th class="n">목표비</th><th class="n">실측비</th>
   <th class="n">이탈률%</th><th class="n">이동률%</th><th class="n">편차%</th><th class="n">스펙대비%</th>
   <th>fail_type</th><th>reason</th><th>게이트</th></tr></thead><tbody>` +
  D.map(d => {
    const g = GROUPS.find(x => x.key === d.role) || GROUPS[0];
    return `<tr><td><code>${d.name}</code></td><td>${d.role}</td>
      <td class="n">${fmtTarget(d.target)}</td><td class="n">${F(measured(d, g))}</td>
      <td class="n">${F(d.spec_out_pct, 3)}</td><td class="n">${F(d.move_pct, 3)}</td>
      <td class="n">${F(d.dev_pct, 3)}</td><td class="n">${F(d.size_pct, 2)}</td>
      <td>${d.fail_type || '–'}</td><td>${d.reason || '–'}</td><td>${d.gate || '–'}</td></tr>`;
  }).join('') + '</tbody>';

const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => {
  const t = e.target.getAttribute && e.target.getAttribute('data-t');
  if (!t) return;
  tip.textContent = t; tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 210) + 'px';
  tip.style.top = (e.clientY - 34) + 'px';
});
document.addEventListener('mouseout', e => {
  if (e.target.getAttribute && e.target.getAttribute('data-t')) tip.style.opacity = 0;
});
</script>
