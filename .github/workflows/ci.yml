# 신뢰성 데이터 분석 툴 — CI
# ---------------------------------------------------------------
# 설계 원칙
#  1. 사내 시험 데이터는 절대 올리지 않는다.
#     Test Data / Perf Data / tests/golden 은 .gitignore 로 이미 제외되어 있다.
#     따라서 CI 에서는 단위 테스트만 돌린다.
#     골든 회귀 검증은 데이터가 있는 로컬에서 pre-push 훅으로 지킨다.
#     (_automation/pre-push.sample 참조)
#  2. 의존성은 numpy 뿐이다 (CLAUDE.md §5-7). 목록을 늘리지 않는다.
#  3. Linux 러너에는 tkinter 가 없다. _automation/headless.py 스텁이
#     그 벽을 넘으므로 기존 소스를 고치지 않고도 돌아간다.
# ---------------------------------------------------------------

name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: numpy 설치 (유일한 의존성)
        run: python -m pip install --upgrade pip numpy

      - name: 단위 테스트
        run: python _automation/run_checks.py

