# 신뢰성 데이터 분석 툴 — CI
# ---------------------------------------------------------------
# 설계 원칙
#  1. 사내 시험 데이터는 절대 올리지 않는다.
#     Test Data / Perf Data / tests/golden 은 .gitignore 로 이미 제외되어 있다.
#     따라서 CI 에서는 단위 테스트만 돌린다.
#     골든 회귀 검증은 데이터가 있는 로컬에서 pre-push 훅으로 지킨다.
#     (_automation/pre-push.sample 참조)
#  2. 의존성은 numpy 뿐이다 (CLAUDE.md §5-7). 목록을 늘리지 않는다.
#  3. Linux 러너에는 tkinter 가 없다. _automation/headless.py 스텁이
#     그 벽을 넘으므로 기존 소스를 고치지 않고도 돌아간다.
# ---------------------------------------------------------------

name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: numpy 설치 (유일한 의존성)
        run: python -m pip install --upgrade pip numpy

      - name: 단위 테스트
        run: python _automation/run_checks.py


  # ─────────────────────────────────────────────────────────────
  # exe 빌드
  #
  # 명령의 근거는 C:\파이썬코딩\CDFCompareToolHTML_Rev0.027.spec 이다.
  #   Analysis(['cdf_compare_web.py']) · console=False · datas/hiddenimports 없음
  #   → pyinstaller --onefile --windowed --name <이름> cdf_compare_web.py 와 동등
  #
  # 이름의 Rev 는 태그가 아니라 소스의 APP_REVISION 에서 뽑는다.
  # 정본이 하나여야 exe 이름과 화면에 찍히는 버전이 어긋나지 않는다.
  # 태그로 릴리스할 때는 둘이 일치하는지 먼저 확인하고, 어긋나면 빌드를 멈춘다.
  #
  # Windows 러너는 Linux 의 2배를 소모하므로 태그 push 또는 수동 실행일 때만 돈다.
  # ─────────────────────────────────────────────────────────────
  build-exe:
    needs: unit-tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # v0.0.32 / v0.0.33 이 스모크 테스트에서 6시간(잡 최대치)을 태우고 잘렸다.
    # 상한을 두어 같은 일이 반복되지 않게 한다 — 정상 빌드는 2분 안에 끝난다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip numpy pyinstaller

      - name: 버전 확인 (소스 APP_REVISION ↔ 태그)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          rev=$(python -c "import re,io; s=io.open('cdf_compare_web.py',encoding='utf-8').read(); print(re.search(r'^APP_REVISION\s*=\s*\"([^\"]+)\"', s, re.M).group(1))")
          name="CDFCompareToolHTML_${rev/./}"          # Rev.0.028 -> Rev0.028
          echo "소스 APP_REVISION = $rev"
          echo "exe 이름          = $name"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"            # v0.0.28 -> 0.0.28
            want="${rev#Rev.}"                         # Rev.0.028 -> 0.028
            # 태그 0.0.28 <-> 소스 0.028 을 숫자로 비교한다
            tag_n=$(python -c "import sys; print(int(sys.argv[1].replace('.','')))" "$tag")
            src_n=$(python -c "import sys; print(int(sys.argv[1].replace('.','')))" "$want")
            if [[ "$tag_n" != "$src_n" ]]; then
              echo "::error::태그(v$tag)와 소스 APP_REVISION($rev)이 어긋납니다. 소스를 고치거나 태그를 다시 다세요."
              exit 1
            fi
          fi
          echo "rev=$rev"   >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: exe 빌드
        run: pyinstaller --onefile --windowed --name ${{ steps.ver.outputs.name }} cdf_compare_web.py

      - name: exe 스모크 테스트 (실제로 뜨는지)
        shell: bash
        timeout-minutes: 10
        run: |
          set -uo pipefail
          name="${{ steps.ver.outputs.name }}"
          exe="dist/$name.exe"
          size=$(stat -c%s "$exe")
          echo "크기: $((size/1024/1024)) MB ($size bytes)"
          # PyInstaller 가 조용히 껍데기만 만드는 경우를 거른다
          if (( size < 5*1024*1024 )); then echo "::error::exe 가 비정상적으로 작습니다"; exit 1; fi

          # 띄운 exe 는 어떤 경로로 끝나든 반드시 회수한다.
          # 예전에는 배경(&)으로 띄우고 /shutdown 에만 맡겨서, 프로세스가 남으면
          # 스크립트가 exit 해도 러너가 단계를 못 끝냈다 (실측: 6시간 뒤 강제 취소).
          cleanup() {
            taskkill //F //IM "$name.exe"          >/dev/null 2>&1 || true
            taskkill //F //IM "${name}_console.exe" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "./$exe" &
          pid=$!
          ok=0
          # v0.0.35 / v0.0.36 이 여기서 멈췄다. 60초가 모자란 것인지, 프로세스가 죽는 것인지
          # 로그만으로는 구분이 안 돼서 셋을 나눠 본다: 대기 180초 · 생사 확인 · 실패 시 진단.
          for i in $(seq 1 180); do
            if curl -sf --connect-timeout 2 --max-time 5 -o /dev/null http://127.0.0.1:8765/; then
              echo "HTTP 200 확인 ( ${i}초 )"
              curl -sf --connect-timeout 2 --max-time 5 -X POST http://127.0.0.1:8765/shutdown >/dev/null 2>&1 || true
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "exe 프로세스가 ${i}초 만에 사라졌습니다 — 뜨다가 죽은 것입니다"
              break
            fi
            if (( i % 15 == 0 )); then echo "  ... ${i}초 대기 중 (프로세스는 살아 있음)"; fi
            sleep 1
          done
          if (( ok == 1 )); then exit 0; fi

          echo "---- 프로세스 ----"
          tasklist //FI "IMAGENAME eq $name.exe" 2>&1 || true
          echo "---- 8765 포트 ----"
          netstat -ano 2>/dev/null | grep ":8765" || echo "(열려 있지 않음)"
          cleanup

          # --windowed 는 stdout/stderr 가 없어서 파이썬이 죽어도 아무 말이 없다.
          # 같은 소스를 콘솔 모드로 한 번 더 빌드해 실제 오류를 받아낸다 (실패했을 때만 돈다).
          echo "---- 콘솔 빌드로 실제 오류 확인 ----"
          pyinstaller --onefile --name "${name}_console" cdf_compare_web.py > build_console.log 2>&1 \
            || { echo "(콘솔 빌드 실패)"; tail -40 build_console.log; }
          if [ -f "dist/${name}_console.exe" ]; then
            "./dist/${name}_console.exe" > console.out 2>&1 &
            cpid=$!
            for i in $(seq 1 60); do
              curl -sf --connect-timeout 2 --max-time 5 -o /dev/null http://127.0.0.1:8765/ && break
              kill -0 "$cpid" 2>/dev/null || break
              sleep 1
            done
            cleanup
            echo "---- 콘솔 빌드 출력 ----"
            cat console.out 2>/dev/null || echo "(출력 없음)"
          fi
          echo "::error::exe 는 만들어졌지만 180초 안에 서버가 뜨지 않았습니다"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: dist/${{ steps.ver.outputs.name }}.exe
          retention-days: 30

      # 태그 push 일 때만 Releases 에 붙인다
      - name: Release 에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.ver.outputs.name }}.exe
          generate_release_notes: true
