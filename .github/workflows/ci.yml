# 신뢰성 데이터 분석 툴 — CI
# ---------------------------------------------------------------
# 설계 원칙
#  1. 사내 시험 데이터는 절대 올리지 않는다.
#     Test Data / Perf Data / tests/golden 은 .gitignore 로 이미 제외되어 있다.
#     따라서 CI 에서는 단위 테스트만 돌린다.
#     골든 회귀 검증은 데이터가 있는 로컬에서 pre-push 훅으로 지킨다.
#     (_automation/pre-push.sample 참조)
#  2. 의존성은 numpy 뿐이다 (CLAUDE.md §5-7). 목록을 늘리지 않는다.
#  3. Linux 러너에는 tkinter 가 없다. _automation/headless.py 스텁이
#     그 벽을 넘으므로 기존 소스를 고치지 않고도 돌아간다.
# ---------------------------------------------------------------

name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: numpy 설치 (유일한 의존성)
        run: python -m pip install --upgrade pip numpy

      - name: 단위 테스트
        run: python _automation/run_checks.py


  # ─────────────────────────────────────────────────────────────
  # exe 빌드
  #
  # 명령의 근거는 C:\파이썬코딩\CDFCompareToolHTML_Rev0.027.spec 이다.
  #   Analysis(['cdf_compare_web.py']) · console=False · datas/hiddenimports 없음
  #   → pyinstaller --onefile --windowed --name <이름> cdf_compare_web.py 와 동등
  #
  # 이름의 Rev 는 태그가 아니라 소스의 APP_REVISION 에서 뽑는다.
  # 정본이 하나여야 exe 이름과 화면에 찍히는 버전이 어긋나지 않는다.
  # 태그로 릴리스할 때는 둘이 일치하는지 먼저 확인하고, 어긋나면 빌드를 멈춘다.
  #
  # Windows 러너는 Linux 의 2배를 소모하므로 태그 push 또는 수동 실행일 때만 돈다.
  # ─────────────────────────────────────────────────────────────
  build-exe:
    needs: unit-tests
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip numpy pyinstaller

      - name: 버전 확인 (소스 APP_REVISION ↔ 태그)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          rev=$(python -c "import re,io; s=io.open('cdf_compare_web.py',encoding='utf-8').read(); print(re.search(r'^APP_REVISION\s*=\s*\"([^\"]+)\"', s, re.M).group(1))")
          name="CDFCompareToolHTML_${rev/./}"          # Rev.0.028 -> Rev0.028
          echo "소스 APP_REVISION = $rev"
          echo "exe 이름          = $name"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"            # v0.0.28 -> 0.0.28
            want="${rev#Rev.}"                         # Rev.0.028 -> 0.028
            # 태그 0.0.28 <-> 소스 0.028 을 숫자로 비교한다
            tag_n=$(python -c "import sys; print(int(sys.argv[1].replace('.','')))" "$tag")
            src_n=$(python -c "import sys; print(int(sys.argv[1].replace('.','')))" "$want")
            if [[ "$tag_n" != "$src_n" ]]; then
              echo "::error::태그(v$tag)와 소스 APP_REVISION($rev)이 어긋납니다. 소스를 고치거나 태그를 다시 다세요."
              exit 1
            fi
          fi
          echo "rev=$rev"   >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: exe 빌드
        run: pyinstaller --onefile --windowed --name ${{ steps.ver.outputs.name }} cdf_compare_web.py

      - name: exe 스모크 테스트 (실제로 뜨는지)
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/${{ steps.ver.outputs.name }}.exe"
          size=$(stat -c%s "$exe")
          echo "크기: $((size/1024/1024)) MB"
          # PyInstaller 가 조용히 껍데기만 만드는 경우를 거른다
          if (( size < 5*1024*1024 )); then echo "::error::exe 가 비정상적으로 작습니다"; exit 1; fi
          "./$exe" &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8765/; then
              echo "HTTP 200 확인 ( ${i}초 )"
              curl -sf -X POST http://127.0.0.1:8765/shutdown >/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::exe 는 만들어졌지만 60초 안에 서버가 뜨지 않았습니다"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: dist/${{ steps.ver.outputs.name }}.exe
          retention-days: 30

      # 태그 push 일 때만 Releases 에 붙인다
      - name: Release 에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.ver.outputs.name }}.exe
          generate_release_notes: true
